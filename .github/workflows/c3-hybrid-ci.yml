name: C3 Hybrid Miner - Compile Check

on:
  push:
    branches:
      - experiment/c3-merged-miner-v1
  pull_request:
    branches:
      - webmanager
  workflow_dispatch:

jobs:
  build-c3:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Compile ESP32-C3 SuperMini
        run: pio run -e ESP32-C3-super-mini
